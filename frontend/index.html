<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Tìm đường - Quận Hai Bà Trưng</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="sidebar">
        <h2>Tìm đường Quận Hai Bà Trưng</h2>

        <div class="section">
            <p class="hint">Nhập địa điểm hoặc click trực tiếp trên bản đồ.</p>
            
            <div class="input-group">
                <label for="start-input">Điểm đi:</label>
                <div class="autocomplete-container">
                    <input type="text" id="start-input" placeholder="Nhập điểm đi hoặc click map..." autocomplete="off">
                    <div id="start-suggestions" class="suggestions-list"></div>
                </div>
            </div>
            
            <div class="input-group">
                <label for="end-input">Điểm đến:</label>
                <div class="autocomplete-container">
                    <input type="text" id="end-input" placeholder="Nhập điểm đến hoặc click map..." autocomplete="off">
                    <div id="end-suggestions" class="suggestions-list"></div>
                </div>
            </div>

            <div class="button-group">
                <button id="find-btn" disabled>Tìm 3 đường đi</button>
                <button id="reset-btn">Đặt lại</button>
            </div>
        </div>

        <div class="section">
            <h3>Kết quả</h3>
            <div id="results">Chưa có kết quả.</div>
        </div>

        <div class="section">
            <h3>Mô phỏng điều kiện đường</h3>
            <p class="hint">Click vào đoạn đường để chuyển trạng thái theo chu kỳ:</p>
            <div class="legend">
                <div><span class="dot dot-1"></span> Thông thoáng</div>
                <div><span class="dot dot-2"></span> Chậm</div>
                <div><span class="dot dot-5"></span> Tắc</div>
                <div><span class="dot dot-flooded"></span> Ngập lụt (rất chậm)</div>
                <div><span class="dot dot-closed"></span> Cấm đường (không đi)</div>
                <div><span class="dot dot-oneway"></span> 1 chiều (mũi tên ▶)</div>
            </div>
            <button id="random-btn">Random traffic</button>
            <button id="demo-special-btn">Demo điều kiện đặc biệt</button>
            <button id="reset-traffic-btn">Đặt lại tất cả</button>
            <button id="auto-sim-btn">Bật mô phỏng auto</button>
            <p class="hint" id="auto-sim-status"></p>
        </div>

        <div id="status">Đang tải...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/traffic.js"></script>
</body>
</html>
